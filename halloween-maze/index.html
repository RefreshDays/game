<style>

<script>
// 문제가 생기면 빈 화면 대신 오류 내용을 보여 준다 (원인 찾기용)
window.addEventListener('error', function (e) {
  var c = document.getElementById('card'); if (!c) return;
  document.getElementById('overlay').classList.remove('hide');
  c.innerHTML = '<h2>😵 게임을 시작하지 못했어요</h2><p>크롬이나 삼성 인터넷 최신 버전으로 열어 주세요.</p><p class="small"></p>';
  c.querySelector('.small').textContent = '오류: ' + (e.message || e.error) + ' (' + (e.lineno || '?') + '줄)';
});
</script>
<script>
'use strict';
// ===================== 설정 =====================
const CFG = {
  hearts: 3,
  playerSpeed: 5.2,                                     // 칸/초
  finalLevel: 10,                                       // 이 레벨을 깨면 엔딩 (이후 무한 모드)
  ghostSpeed: n => Math.min(1.5 + (n - 1) * 0.25, 3.6), // 칸/초 (소년 5.2보다 훨씬 느림)
  ghostCount: n => Math.min(1 + Math.floor((n - 1) / 2), 4),
  ghostSense: n => Math.min(4 + n, 10),                 // 이 거리(길 따라 칸 수) 안에 들어와야 쫓아옴
  ghostChaos: n => Math.max(0.2, 0.45 - n * 0.04),      // 쫓을 때도 엉뚱한 길로 갈 확률
  ghostTurnBack: 0.3,                                   // 떠돌 때 갑자기 뒤돌아갈 확률 (왔다 갔다)
  ghostPause: 0.18,                                     // 떠돌 때 잠깐 멈춰서 두리번거릴 확률
  candyCount: n => Math.min(2 + n, 10),
  mazeCells: n => Math.min(30 + n * 10, 170),
  lightRadius: n => Math.max(2.2, 3.4 - n * 0.12),      // 칸 단위
  firstGhostDelay: n => Math.max(4, 9 - n), ghostGap: 6, invincible: 2,
  // 제한시간 = (사탕을 가까운 순서로 다 먹고 출구까지 가는 최단 길이 ÷ 소년 속도) × timeFactor + timeExtra, 10초 단위 올림
  timeFactor: 6, timeExtra: 40, warnTime: 15,
  // 점수
  scoreCandy: 100, scoreClear: 300, scoreSecond: 5, scoreHeart: 100,
};

// ===================== 온라인 랭킹 (선택) =====================
// 친구들이 각자 휴대폰에서 같은 랭킹을 보려면 무료 Firebase 프로젝트를 만들고 아래 두 값을 채우세요.
// 방법은 docs/halloween-maze-개발정의서.md "온라인 랭킹 설정" 참고. 비워 두면 '이 기기 랭킹'만 동작합니다.
const ONLINE = { projectId: 'halloween-maze-f201d', apiKey: 'AIzaSyB_0zadd9ZydBL63yuVh5uwQ-URwGnbRmo', collection: 'halloween_scores',
  // 같이 하기(실시간 협동)용 Firebase Realtime Database 주소. 비워 두면 협동 모드는 "설정 필요"로 표시됨
  rtdbUrl: '' };

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d');
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

let state = 'title';
let level = 1, hearts = CFG.hearts, levelTime = 0, clock = 0, inv = 0;
let maze = null, W = 0, H = 0, tile = 20, dpr = 1;
let player, ghosts = [], candies = [], exitT, startT, distMap = null, particles = [];
let got = 0, exitOpen = false, exitFound = false, runTime = 0, runCandies = 0, lockedToastAt = -9;
let timeLimit = 60, timeLeft = 60, lastTick = 99, runScore = 0, lastBonus = null, overReason = 'ghost', rankTab = 'local', lastRank = null;
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
let audioMode = store.get('hm_audio') || 'all';      // all: 음악+효과음, sfx: 효과음만, off: 끄기
let sound = audioMode !== 'off';
let playerName = store.get('hm_name') || '';
let best = +store.get('hm_best') || 0;

// ===================== 미로 생성 =====================
function genMaze(cw, ch) {
  const w = cw * 2 + 1, h = ch * 2 + 1;
  const g = Array.from({ length: h }, () => Array(w).fill(1));
  const vis = Array.from({ length: ch }, () => Array(cw).fill(false));
  const stack = [[0, 0]]; vis[0][0] = true; g[1][1] = 0;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => [cx + dx, cy + dy, dx, dy])
      .filter(([x, y]) => x >= 0 && y >= 0 && x < cw && y < ch && !vis[y][x]);
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[rng() * nb.length | 0];
    vis[ny][nx] = true;
    g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0;
    g[ny * 2 + 1][nx * 2 + 1] = 0;
    stack.push([nx, ny]);
  }
  // 막다른 길만 있으면 유령을 피할 수 없으니 순환로를 조금 뚫는다
  const extra = Math.floor(cw * ch * 0.12);
  for (let i = 0, tries = 0; i < extra && tries < 3000; tries++) {
    const x = 1 + Math.floor(rng() * (w - 2)), y = 1 + Math.floor(rng() * (h - 2));
    if (g[y][x] !== 1) continue;
    if ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0)) { g[y][x] = 0; i++; }
  }
  return { g, w, h };
}
const isFloor = (x, y) => x >= 0 && y >= 0 && x < W && y < H && maze[y][x] === 0;

function bfs(sx, sy) {
  const d = Array.from({ length: H }, () => Array(W).fill(Infinity));
  d[sy][sx] = 0; const q = [[sx, sy]];
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const k in DIRS) {
      const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
      if (isFloor(nx, ny) && d[ny][nx] === Infinity) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return d;
}
// ===================== 같은 미로 (방 번호) =====================
// 방 번호가 같으면 미로·사탕·출구·유령 출발 위치·제한시간이 모두 똑같이 만들어진다.
let roomCode = '', rng = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rng() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ===================== 레벨 준비 =====================
function setupLevel() {
  const { w: sw, h: sh } = stageSize();
  rng = roomCode ? mulberry32(+roomCode * 1009 + level * 7919) : Math.random;
  // 같은 미로 모드에선 휴대폰 화면 비율과 상관없이 같은 크기의 (세로형) 미로
  const aspect = roomCode ? 0.62 : Math.max(0.45, Math.min(2.2, sw / sh));
  const N = CFG.mazeCells(level);
  const cw = Math.max(4, Math.round(Math.sqrt(N * aspect)));
  const ch = Math.max(4, Math.round(N / cw));
  const m = genMaze(cw, ch); maze = m.g; W = m.w; H = m.h;

  startT = { x: 1, y: 1 };
  const d0 = bfs(1, 1);
  const floors = [];
  let far = startT, maxD = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (maze[y][x] === 0) {
    floors.push({ x, y, d: d0[y][x] });
    if (d0[y][x] > maxD) { maxD = d0[y][x]; far = { x, y }; }
  }
  exitT = far;

  // 사탕: 서로 떨어지게 배치
  const cand = shuffle(floors.filter(f => f.d >= 4 && !(f.x === exitT.x && f.y === exitT.y) && f.x % 2 === 1 && f.y % 2 === 1));
  const want = CFG.candyCount(level);
  candies = [];
  for (const minGap of [5, 3, 1]) {
    for (const f of cand) {
      if (candies.length >= want) break;
      if (candies.some(c => c.x === f.x && c.y === f.y)) continue;
      if (candies.every(c => Math.abs(c.x - f.x) + Math.abs(c.y - f.y) >= minGap))
        candies.push({ x: f.x, y: f.y, taken: false, hue: [0, 30, 50, 120, 200, 280, 320][candies.length % 7], ph: Math.random() * 6 });
    }
  }

  // 유령: 출발점에서 먼 곳
  const spawnPool = shuffle(floors.filter(f => f.d >= maxD * 0.5));
  ghosts = [];
  for (let i = 0; i < CFG.ghostCount(level); i++) {
    const s = spawnPool[i % spawnPool.length];
    ghosts.push({ sx: s.x, sy: s.y, ph: Math.random() * 6 });
  }
  levelTime = 0; particles = [];
  timeLimit = timeLeft = calcTimeLimit(); lastTick = 99;
  resetRound();
  resize();
  updateHud();
}

function calcTimeLimit() {
  let pos = [startT.x, startT.y], left = candies.map(c => [c.x, c.y]), total = 0;
  while (left.length) {
    const d = bfs(pos[0], pos[1]);
    let bi = 0; left.forEach((c, i) => { if (d[c[1]][c[0]] < d[left[bi][1]][left[bi][0]]) bi = i; });
    total += d[left[bi][1]][left[bi][0]]; pos = left.splice(bi, 1)[0];
  }
  total += bfs(pos[0], pos[1])[exitT.y][exitT.x];
  return Math.ceil((total / CFG.playerSpeed * CFG.timeFactor + CFG.timeExtra) / 10) * 10;
}
// 처음 상태로: 사탕 다시 놓기, 출구 다시 숨기고 잠그기, 소년/유령 제자리
function resetRound() {
  for (const c of candies) c.taken = false;
  got = 0; exitOpen = false; exitFound = false;
  resetActors();
}
function resetPlayer() {
  player = { x: startT.x, y: startT.y, px: startT.x, py: startT.y, tx: startT.x, ty: startT.y, moving: false, face: 1, step: 0 };
  autoDir = null;
}
function resetActors() {
  resetPlayer();
  ghosts.forEach((g, i) => {
    Object.assign(g, { x: g.sx, y: g.sy, px: g.sx, py: g.sy, tx: g.sx, ty: g.sy, moving: false, dir: null,
      wait: CFG.firstGhostDelay(level) + i * CFG.ghostGap, pause: 0 });
  });
  autoDir = null;
  distMap = bfs(player.x, player.y);
}

// ===================== 입력 =====================
let keyStack = [], padDir = null, autoDir = null;

function render() {

  for (const g of ghosts) drawGhost(ctx, g, false);
  const mates = coop ? coopMates() : [];
  for (const m of mates) drawFig(ctx, m.v, coopColor(m.id));
  drawPlayer(ctx);
  // 어둠: 주인공(협동이면 친구들까지) 주변만 동그랗게 밝다
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  dctx.fillStyle = '#000'; dctx.fillRect(0, 0, W * t, H * t);
  dctx.globalCompositeOperation = 'destination-out';
  const R = CFG.lightRadius(level) * t * (1 + Math.sin(clock * 7) * .02 + Math.sin(clock * 13) * .015);
  const lights = [player].concat(mates.map(m => m.v));
  for (const L of lights) {
    const lx = L.px * t + t / 2, ly = L.py * t + t / 2;
    const grd = dctx.createRadialGradient(lx, ly, R * .35, lx, ly, R);
    grd.addColorStop(0, 'rgba(0,0,0,1)'); grd.addColorStop(.7, 'rgba(0,0,0,.8)'); grd.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  for (const L of lights) {
    const lx = L.px * t + t / 2, ly = L.py * t + t / 2;
    const warm = ctx.createRadialGradient(lx, ly, 0, lx, ly, R);
    warm.addColorStop(0, 'rgba(255,150,40,.12)'); warm.addColorStop(1, 'rgba(255,150,40,0)');

  if (exitFound) drawExit(ctx);   // 출구는 불빛으로 한 번 비춰서 찾아야 보인다
  for (const k of candies) if (!k.taken) drawCandy(ctx, k);
  for (const g of ghosts) if (lights.every(L => Math.hypot(g.px - L.px, g.py - L.py) > CFG.lightRadius(level) * .8)) drawGhost(ctx, g, true);

  ctx.font = `800 ${Math.max(10, t * .42)}px system-ui,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';

    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.strokeText(m.name, x, y); ctx.fillStyle = coopColor(m.id); ctx.fillText(m.name, x, y);

  ctx.globalAlpha = 1;
}

// 다시 열거나 처음 화면으로 가도 그 레벨부터, 그때 점수 그대로 이어서 할 수 있다.
function allCheckpoints() { try { return JSON.parse(store.get('hm_prog') || '{}'); } catch (e) { return {}; } }
function getCheckpoint(nm) { const cp = nm && allCheckpoints()[nm]; return cp && cp.level > 1 ? cp : null; }
function saveCheckpoint() {
  if (!playerName) return;
  const all = allCheckpoints(), cur = all[playerName], next = level + 1;
  if (cur && cur.level > next) return;            // 처음부터 다시 하는 중이면 더 높은 기록을 지우지 않음
  all[playerName] = { level: next, score: runScore, candies: runCandies, time: Math.round(runTime), room: roomCode };
  store.set('hm_prog', JSON.stringify(all));
}
function loadCheckpoint(cp) { newRun(); level = cp.level; runScore = cp.score || 0; runCandies = cp.candies || 0; runTime = cp.time || 0; }
function refreshCont() {
  const inp = $('#nameIn'), btn = $('#contBtn'), st = $('#startBtn'); if (!inp || !btn) return;
  const cp = getCheckpoint(inp.value.trim().slice(0, 8));
  btn.style.display = cp ? '' : 'none';
  if (cp) btn.textContent = `▶ 이어하기 (${cp.room ? '방 ' + cp.room + ' · ' : ''}레벨 ${cp.level}부터 · ⭐${cp.score})`;
  st.textContent = cp ? '🔄 처음부터' : '시작하기';
  st.classList.toggle('alt', !!cp);
}
$('#card').addEventListener('input', e => { if (e.target.id === 'nameIn') refreshCont(); });
function newRun() { runTime = 0; runCandies = 0; runScore = 0; lastBonus = null; lastRank = null; }
function begin() { $('#overlay').classList.add('hide'); setupLevel(); inv = 0; state = 'play'; toast(`${roomCode ? '👫 방 ' + roomCode + ' · ' : ''}레벨 ${level} · 사탕 ${candies.length}개를 찾아라!`); }
const roomMark = () => roomCode ? `👫 방 <b>${roomCode}</b> · ` : '';
function togglePause() {
  if (coop) { if (state === 'play') showOverlay('coopmenu'); return; }
  if (state === 'play') { state = 'pause'; showOverlay('pause'); }
  else if (state === 'pause') { state = 'play'; $('#overlay').classList.add('hide'); }
}
$('#bPause').addEventListener('click', togglePause);
$('#bSound').addEventListener('click', () => {
  audioMode = { all: 'sfx', sfx: 'off', off: 'all' }[audioMode]; sound = audioMode !== 'off';
  store.set('hm_audio', audioMode); unlockAudio(); updateHud();
  toast({ all: '🎵 음악 + 효과음', sfx: '🔊 효과음만', off: '🔇 소리 끔' }[audioMode]);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !coop) togglePause(); });

// ===================== 랭킹 =====================
// 이 기기 랭킹: 이름별 최고 점수 (친구들이 한 휴대폰을 돌려가며 할 때)
// 친구 랭킹: ONLINE 설정 시 Firebase Firestore(REST)로 이름별 최고 점수 공유
function localRanks() { try { return JSON.parse(store.get('hm_rank') || '{}'); } catch (e) { return {}; } }
const sortRanks = obj => Object.entries(obj).map(([name, v]) => Object.assign({ name }, v)).sort((a, b) => b.score - a.score);
const onlineReady = () => !!(ONLINE.projectId && ONLINE.apiKey);
const fsBase = () => `https://firestore.googleapis.com/v1/projects/${ONLINE.projectId}/databases/(default)/documents`;
function withTimeout(pr, ms = 10000) { return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
async function onlineTop(n = 30) {
  const r = await withTimeout(fetch(`${fsBase()}:runQuery?key=${ONLINE.apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ structuredQuery: { from: [{ collectionId: ONLINE.collection }], orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: n } }) }));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).filter(x => x.document).map(x => {
    const f = x.document.fields || {};
    return { name: (f.name && f.name.stringValue || '?').slice(0, 8), score: +(f.score && f.score.integerValue || 0), level: +(f.level && f.level.integerValue || 0) };
  });
}
async function onlineSubmit(entry) {
  const url = `${fsBase()}/${ONLINE.collection}/${encodeURIComponent(entry.name)}?key=${ONLINE.apiKey}`;
  const cur = await withTimeout(fetch(url));
  if (cur.ok) { const f = (await cur.json()).fields || {}; if (+(f.score && f.score.integerValue || 0) >= entry.score) return; }
  await withTimeout(fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: {
    name: { stringValue: entry.name }, score: { integerValue: String(entry.score) }, level: { integerValue: String(entry.level) },
    at: { timestampValue: new Date().toISOString() } } }) }));
}
async function recordScore() {
  if (!playerName || runScore <= 0) { lastRank = null; return; }
  const reached = state === 'clear' ? level : level - 1;   // 탈출에 성공한 마지막 레벨
  const all = localRanks(), prev = all[playerName];
  const newBest = !prev || runScore > prev.score;
  if (newBest) { all[playerName] = { score: runScore, level: reached, at: Date.now() }; store.set('hm_rank', JSON.stringify(all)); }
  lastRank = { newBest, local: sortRanks(all).findIndex(r => r.name === playerName) + 1, online: 0 };
  if (onlineReady()) {
    try {
      await onlineSubmit({ name: playerName, score: runScore, level: reached });
      const top = await onlineTop(100); const i = top.findIndex(r => r.name === playerName); if (i >= 0) lastRank.online = i + 1;
    } catch (e) { toast('🌐 친구 랭킹 저장 실패 (인터넷 확인)'); }
  }
}
async function renderRank() {
  const ul = $('#rankList'); if (!ul) return;
  const draw = rows => {
    ul.innerHTML = '';
    if (!rows.length) { ul.innerHTML = '<li>아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</li>'; return; }
    rows.slice(0, 30).forEach((r, i) => {
      const li = document.createElement('li'); if (r.name === playerName) li.className = 'me';
      li.innerHTML = `<span class="n">${['🥇', '🥈', '🥉'][i] || i + 1}</span><span class="nm"></span><span class="lv">Lv.${r.level}</span><span class="sc">${r.score}</span>`;
      li.querySelector('.nm').textContent = r.name; ul.appendChild(li);
    });
  };
  if (rankTab === 'local') return draw(sortRanks(localRanks()));
  if (!onlineReady()) { ul.innerHTML = '<li>친구 랭킹(온라인)은 아직 설정되지 않았어요.<br>부모님이 설정하면 친구들 휴대폰과 랭킹을 함께 볼 수 있어요.</li>'; return; }
  try { const rows = await onlineTop(30); if (rankTab === 'online' && $('#rankList') === ul) draw(rows); }
  catch (e) { ul.innerHTML = '<li>친구 랭킹을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</li>'; }
}

// ===================== 🤝 같이 하기 (실시간 협동, Firebase Realtime Database) =====================
// 방 데이터: coop/<번호>/{ meta, players/<pid>, ghosts }
//  - meta: status(lobby|play|clear|over|ending), level, round(판마다 +1), startAt, hearts, score, candies{번호:pid}, exitFound
//  - players: 이름·위치(x,y)·마지막 신호 시각(t). 8초 넘게 신호가 없으면 나간 것으로 봄
//  - ghosts: 방장(가장 먼저 들어온 사람)의 폰이 유령을 움직이고 위치를 보냄. 방장이 나가면 다음 사람이 이어받음
const COOP_COLORS = ['#ff7a14', '#2fa8ff', '#e83fa0', '#3fbf3a'];
const SV_TS = { '.sv': 'timestamp' };
let coop = null;
const coopReady = () => !!ONLINE.rtdbUrl;
const sNow = () => Date.now() + (coop ? coop.off : 0);
const coopMeta = () => (coop && coop.room && coop.room.meta) || {};
function coopUrl(path) { return `${ONLINE.rtdbUrl.replace(/\/$/, '')}/coop/${coop.code}${path ? '/' + path : ''}.json`; }
async function coopReq(method, path, body) {
  const r = await withTimeout(fetch(coopUrl(path), { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) }), 8000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function coopSend(method, path, body) { if (coop) coopReq(method, path, body).catch(() => { }); }
function coopMsg(t) { const el = $('#coopMsg'); if (el) el.textContent = t; else toast(t); }
function newCoop(code) {
  let pid = sessionStorageGet('hm_pid');
  if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); sessionStorageSet('hm_pid', pid); }
  return { code, pid, room: {}, off: 0, round: 0, status: '', startAt: Date.now(), sentAt: 0, beatAt: 0, ghostAt: 0, distAt: 0, lastPos: '', view: {}, hitAt: null, wasOpen: false, wasFound: false, hostWas: null, overSent: 0 };
}
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
// 실시간 스트림을 로컬 사본(coop.room)에 반영
function setChild(o, k, v) {
  if (k.indexOf('/') >= 0) { applyAt(o, '/' + k, v, false); return; }
  if (v === null) delete o[k]; else o[k] = v;
}
function applyAt(root, path, data, merge) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) {
    if (merge) { for (const k in data) setChild(root, k, data[k]); return root; }
    return (data && typeof data === 'object') ? data : {};
  }
  let o = root;
  for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length - 1];
  if (merge) { if (!o[last] || typeof o[last] !== 'object') o[last] = {}; for (const k in data) setChild(o[last], k, data[k]); }
  else setChild(o, last, data);
  return root;
}
function coopListen() {
  const es = new EventSource(coopUrl(''));
  coop.es = es;
  const on = merge => e => {
    if (!coop || coop.es !== es) return;
    try { const m = JSON.parse(e.data); coop.room = applyAt(coop.room || {}, m.path, m.data, merge); } catch (err) { return; }
    coopOnChange();
  };
  es.addEventListener('put', on(false)); es.addEventListener('patch', on(true));
  es.addEventListener('cancel', () => toast('😢 방 연결이 거절됐어요 (Firebase 규칙 확인)'));
}
// 지금 방에 있는 사람들 (들어온 순서)
function coopPlayers() {
  const ps = (coop && coop.room.players) || {}, now = sNow();
  return Object.keys(ps).filter(id => ps[id] && ps[id].name && (id === coop.pid || now - (ps[id].t || 0) < 8000))
    .sort((a, b) => (ps[a].joined || 0) - (ps[b].joined || 0) || (a < b ? -1 : 1)).map(id => Object.assign({ id }, ps[id]));
}
function coopColor(id) { const i = coopPlayers().findIndex(p => p.id === id); return COOP_COLORS[(i < 0 ? 0 : i) % COOP_COLORS.length]; }
function coopIsHost() { const ps = coopPlayers(); return !!coop && ps.length > 0 && ps[0].id === coop.pid; }
// 친구들 화면 위치 (받은 위치로 부드럽게 따라감)
function coopMates() {
  const out = [];
  for (const p of coopPlayers()) {
    if (p.id === coop.pid || typeof p.x !== 'number' || p.r !== coop.round) continue;
    let v = coop.view[p.id];
    if (!v || Math.hypot(v.px - p.x, v.py - p.y) > 3) v = coop.view[p.id] = { px: p.x, py: p.y, step: 0, moving: false, face: 1 };
    out.push({ id: p.id, name: p.name, v, tx: p.x, ty: p.y, f: p.f || 1 });
  }
  return out;
}
async function coopCreate() {
  for (let tries = 0; tries < 6; tries++) {
    const code = String(1000 + Math.floor(Math.random() * 9000));
    coop = newCoop(code);
    const m = await coopReq('GET', 'meta');
    if (m && m.created && Date.now() - m.created < 6 * 3600e3) continue;   // 최근에 쓰는 방 번호는 피함
    await coopReq('PUT', '', { meta: { status: 'lobby', level: 1, round: 0, hearts: CFG.hearts, score: 0, created: SV_TS } });
    return coopEnter();
  }
  throw new Error('busy');
}
async function coopJoin(code) {
  coop = newCoop(code);
  const room = await coopReq('GET', '').catch(e => { coop = null; throw e; });
  if (!room || !room.meta) { coop = null; throw new Error('noroom'); }
  coop.room = room;
  if (coopPlayers().filter(p => p.id !== coop.pid).length >= 4) { coop = null; throw new Error('full'); }
  return coopEnter();
}
async function coopEnter() {
  const t0 = Date.now();
  const res = await coopReq('PUT', 'players/' + coop.pid, { name: playerName, joined: SV_TS, t: SV_TS, x: 1, y: 1, f: 1, r: 0 });
  const t1 = Date.now();
  if (res && typeof res.t === 'number') coop.off = res.t - (t0 + t1) / 2;   // 폰마다 시계가 달라도 같은 시간 기준
  coopListen();
  state = 'lobby'; showOverlay('lobby');
}
function coopLobbyUpdate() {
  const ul = $('#coopList'), ctl = $('#lobbyCtl'); if (!ul || !coop) return;
  ul.innerHTML = '';
  coopPlayers().forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="background:${COOP_COLORS[i % 4]}"></span><span class="nm"></span>${i === 0 ? ' 👑' : ''}${p.id === coop.pid ? ' (나)' : ''}`;
    li.querySelector('.nm').textContent = p.name; ul.appendChild(li);
  });
  const m = coopMeta(), host = coopIsHost();
  const html = m.status && m.status !== 'lobby' ? `<p>다른 친구들이 게임 중이에요. 다음 판부터 같이 해요!</p>`
    : host ? `<button class="bbtn" data-act="coopstart">▶ 모두 모였어! 시작하기</button>` : `<p>👑 방장이 시작하면 바로 시작돼요…</p>`;
  if (ctl.dataset.h !== html) { ctl.innerHTML = html; ctl.dataset.h = html; }
}
function coopStartGame() {
  const m = coopMeta();
  coopSend('PATCH', 'meta', { status: 'play', level: 1, round: (m.round || 0) + 1, startAt: SV_TS, hearts: CFG.hearts, score: 0, levelScore: 0, candies: null, exitFound: null, bonus: null, reason: null, clearBy: null });
}
function coopRetry() {
  const m = coopMeta();
  coopSend('PATCH', 'meta', { status: 'play', round: (m.round || 0) + 1, startAt: SV_TS, hearts: CFG.hearts, score: m.levelScore || 0, candies: null, exitFound: null, bonus: null, reason: null, clearBy: null });
}
function coopNext(force) {
  const m = coopMeta();
  if (!force && m.status !== 'clear') return;
  coopSend('PATCH', 'meta', { status: 'play', level: (m.level || 1) + 1, round: (m.round || 0) + 1, startAt: SV_TS, levelScore: m.score || 0, candies: null, exitFound: null, bonus: null, clearBy: null });
}
function coopClear() {
  const m = coopMeta(); if (m.status !== 'play' || m.round !== coop.round) return;
  const b = { candy: got * CFG.scoreCandy, clear: level * CFG.scoreClear, time: Math.ceil(timeLeft) * CFG.scoreSecond, heart: hearts * CFG.scoreHeart };
  b.total = b.candy + b.clear + b.time + b.heart;
  coopSend('PATCH', 'meta', { status: level === CFG.finalLevel ? 'ending' : 'clear', score: (m.score || 0) + b.total, bonus: b, clearBy: playerName, clearAt: SV_TS });
  state = 'wait';
}
function coopCaught() {
  const m = coopMeta();
  SFX.hit(); if (navigator.vibrate) navigator.vibrate(200);
  burst(player.px, player.py, '#ffffff', 20);
  inv = CFG.invincible; resetPlayer();
  const h = Math.max(0, (m.hearts || 0) - 1);
  const patch = { hearts: h, hit: { name: playerName, pid: coop.pid, at: SV_TS } };
  if (h <= 0) { patch.status = 'over'; patch.reason = 'ghost'; }
  hearts = h; updateHud();
  coopSend('PATCH', 'meta', patch);
  toast(h > 0 ? '👻 잡혔다! 처음 자리로! (팀 하트 -1)' : '👻 잡혔다!');
}
function coopTimeUp() {
  if (coopIsHost() && coop.overSent !== coop.round && coopMeta().status === 'play') { coop.overSent = coop.round; coopSend('PATCH', 'meta', { status: 'over', reason: 'time' }); }
}
function coopLeave() {
  if (coop) {
    try { fetch(coopUrl('players/' + coop.pid), { method: 'DELETE', keepalive: true }).catch(() => { }); } catch (e) { }
    if (coop.es) coop.es.close();
  }
  coop = null; roomCode = ''; state = 'title'; showOverlay('title'); updateHud();
}
addEventListener('pagehide', () => { if (coop) try { fetch(coopUrl('players/' + coop.pid), { method: 'DELETE', keepalive: true }); } catch (e) { } });
// 방 데이터가 바뀔 때마다
function coopOnChange() {
  if (!coop) return;
  const m = coopMeta();
  if (state === 'lobby') coopLobbyUpdate();
  if (m.status === 'play' && m.round && m.round !== coop.round) { coopBeginRound(m); }
  else if (m.round === coop.round && m.status !== coop.status) {
    coop.status = m.status;
    if (m.status === 'clear') {
      state = 'clear'; SFX.win(); runCandies += got; lastBonus = m.bonus || null; runScore = m.score || 0; level = m.level || level;
      showOverlay('coopclear');
    } else if (m.status === 'ending') {
      state = 'clear'; SFX.win(); runCandies += got; lastBonus = m.bonus || null; runScore = m.score || 0;
      if (level > best) { best = level; store.set('hm_best', best); }
      recordScore().then(() => showOverlay('ending'));
    } else if (m.status === 'over') {
      state = 'over'; SFX.over(); overReason = m.reason || 'ghost'; runScore = m.score || 0;
      recordScore().then(() => showOverlay('coopover'));
    }
  }
  if (coop.round && m.round === coop.round && (state === 'play' || state === 'wait')) coopSyncShared(m);
  if (m.hit && m.hit.at !== coop.hitAt) {
    const first = coop.hitAt === null; coop.hitAt = m.hit.at;
    if (!first && m.hit.pid !== coop.pid && state === 'play') { toast(`👻 ${m.hit.name} 잡혔어! 팀 하트 -1`); SFX.hit(); }
  }
  if (typeof m.hearts === 'number') hearts = m.hearts;
  if (typeof m.score === 'number') runScore = m.score;
  // 방장이 아니면 유령 위치를 받아서 따라감
  const gs = coop.room.ghosts;
  if (!coopIsHost() && gs && gs.r === coop.round && gs.l) {
    const list = Array.isArray(gs.l) ? gs.l : Object.keys(gs.l).map(k => gs.l[k]);
    list.forEach((a, i) => { const g = ghosts[i]; if (!g || !a) return; g.tpx = a[0]; g.tpy = a[1]; g.dir = ['up', 'down', 'left', 'right'][a[2]] || null; g.wait = a[3] ? 1 : 0; g.chase = !!a[4]; });
  }
  updateHud();
}
function coopBeginRound(m) {
  coop.round = m.round; coop.status = 'play'; coop.wasOpen = false; coop.wasFound = false; coop.view = {};
  roomCode = coop.code; level = m.level || 1; hearts = typeof m.hearts === 'number' ? m.hearts : CFG.hearts; runScore = m.score || 0;
  coop.startAt = typeof m.startAt === 'number' ? m.startAt : sNow();
  $('#overlay').classList.add('hide');
  setupLevel(); inv = 0; state = 'play';
  for (const g of ghosts) { g.tpx = g.px; g.tpy = g.py; }
  coop.lastPos = ''; coop.sentAt = 0;
  coopSyncShared(m);
  toast(`🤝 레벨 ${level} · 다 같이 사탕 ${candies.length}개를 찾자!`);
}
// 사탕·출구는 팀이 같이 쓴다
function coopSyncShared(m) {
  const tk = m.candies || {};
  candies.forEach((c, i) => {
    const on = tk[i] !== undefined && tk[i] !== null;
    if (on) { if (!c.taken) { c.taken = true; burst(c.x, c.y, `hsl(${c.hue},90%,60%)`, 10); if (tk[i] !== coop.pid) SFX.candy(); } c.pending = false; }
    else if (c.taken && !c.pending) c.taken = false;
  });
  got = candies.filter(c => c.taken).length;
  exitOpen = got === candies.length;
  if (exitOpen && !coop.wasOpen) { coop.wasOpen = true; SFX.open(); toast((exitFound || m.exitFound) ? '🚪 출구가 열렸어! 아무나 들어가면 다 같이 탈출!' : '🔓 어딘가 출구가 열렸어! 다 같이 찾아보자!'); }
  if (m.exitFound && !exitFound) { exitFound = true; SFX.found(); toast('🚪 친구가 출구를 찾았어!'); }
  updateHud();
}
// 유령: 방장 폰이 움직이고, 나머지는 받은 위치를 부드럽게 따라감
function coopGhosts(dt) {
  if (coopIsHost()) {
    if (coop.hostWas !== coop.pid) {   // 방금 방장이 됐으면 지금 보이는 위치에서 이어서 움직임
      coop.hostWas = coop.pid;
      for (const g of ghosts) { g.x = g.tx = Math.round(g.px); g.y = g.ty = Math.round(g.py); g.px = g.x; g.py = g.y; g.moving = false; g.pause = 0; if (g.wait > 0 && levelTime > 1) g.wait = Math.min(g.wait, .5); }
    }
    if (clock - coop.distAt > .25) {   // 가장 가까운 친구를 쫓도록, 모든 친구 위치에서 거리 계산
      coop.distAt = clock;
      const pts = [[player.x, player.y]].concat(coopMates().map(m => [Math.round(m.tx), Math.round(m.ty)]));
      distMap = multiBfs(pts);
    }
    for (const g of ghosts) stepGhost(g, dt);
    if (Date.now() - coop.ghostAt > 120) {
      coop.ghostAt = Date.now();
      coopSend('PUT', 'ghosts', { r: coop.round, l: ghosts.map(g => [+g.px.toFixed(2), +g.py.toFixed(2), ['up', 'down', 'left', 'right'].indexOf(g.dir), g.wait > 0 ? 1 : 0, g.chase ? 1 : 0]) });
    }
  } else {
    coop.hostWas = null;
    for (const g of ghosts) {
      if (typeof g.tpx !== 'number') continue;
      if (Math.hypot(g.tpx - g.px, g.tpy - g.py) > 2) { g.px = g.tpx; g.py = g.tpy; }
      const k = Math.min(1, dt * 12); g.px += (g.tpx - g.px) * k; g.py += (g.tpy - g.py) * k;
    }
  }
}
function multiBfs(pts) {
  const d = Array.from({ length: H }, () => Array(W).fill(Infinity)), q = [];
  for (const [x, y] of pts) if (isFloor(x, y) && d[y][x] !== 0) { d[y][x] = 0; q.push([x, y]); }
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const k in DIRS) { const nx = x + DIRS[k][0], ny = y + DIRS[k][1]; if (isFloor(nx, ny) && d[ny][nx] === Infinity) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); } }
  }
  return d;
}
// 매 프레임: 내 위치 보내기, 신호 유지, 친구 위치 부드럽게, 방장 일 처리
function coopTick(dt) {
  if (!coop) return;
  const now = Date.now(), m = coopMeta();
  if ((state === 'play' || state === 'wait') && player && now - coop.sentAt > 100) {
    const k = `${player.px.toFixed(2)},${player.py.toFixed(2)},${player.face}`;
    if (k !== coop.lastPos || now - coop.beatAt > 2000) {
      coop.sentAt = now; coop.beatAt = now; coop.lastPos = k;
      coopSend('PATCH', 'players/' + coop.pid, { x: +player.px.toFixed(2), y: +player.py.toFixed(2), f: player.face, r: coop.round, t: SV_TS });
    }
  } else if (now - coop.beatAt > 2000) { coop.beatAt = now; coopSend('PATCH', 'players/' + coop.pid, { t: SV_TS }); }
  for (const mt of (state === 'play' || state === 'wait') ? coopMates() : []) {
    const v = mt.v, k = Math.min(1, dt * 12), ox = v.px, oy = v.py;
    v.px += (mt.tx - v.px) * k; v.py += (mt.ty - v.py) * k; v.face = mt.f;
    const mv = Math.hypot(v.px - ox, v.py - oy); v.moving = mv > .002; v.step += mv;
  }
  if (state === 'lobby' && now - (coop.lobbyAt || 0) > 1000) { coop.lobbyAt = now; coopLobbyUpdate(); }
  // 방장: 탈출 4초 뒤 다음 레벨 시작 (방장이 나가도 다음 방장이 이어서)
  if (coopIsHost() && m.status === 'clear' && m.round === coop.round && typeof m.clearAt === 'number' && sNow() - m.clearAt > 4000 && coop.nextSent !== m.round) {
    coop.nextSent = m.round; coopNext(false);
  }
  if (state === 'clear' && m.status === 'clear') { const el = $('#nextMsg'); if (el && typeof m.clearAt === 'number') el.textContent = `다음 레벨까지 ${Math.max(0, Math.ceil(4 - (sNow() - m.clearAt) / 1000))}초…`; }
}

// ===================== 메인 루프 =====================
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (state === 'play') update(dt);
  if (coop) coopTick(dt);
  musicSync();
  render();
  requestAnimationFrame(loop);
}
// 타이틀 화면 뒤에 미리보기 미로를 깔아 둔다
setupLevel(); updateHud(); showOverlay('title');
requestAnimationFrame(loop);
// 테스트용 훅
window.__game = { get state() { return state; }, get player() { return player; }, get ghosts() { return ghosts; }, get candies() { return candies; }, get exit() { return exitT; }, get maze() { return maze; }, get exitOpen() { return exitOpen; }, get exitFound() { return exitFound; }, get got() { return got; }, set level(v) { level = v; }, get timeLeft() { return timeLeft; }, set timeLeft(v) { timeLeft = v; }, get timeLimit() { return timeLimit; }, get W() { return W; }, get room() { return roomCode; }, get coop() { return coop; }, get lvl() { return level; }, get runScore() { return runScore; }, get music() { return !!mTimer; }, regen: () => setupLevel(), get hearts() { return hearts; } };
